# basic configs
scale: 1
manual_seed: 0
verbose: true
gt_bit_depth: 8

# dataset configs
dataset:
  degradation:
    type: Synth
    sigma: 1.5

  train:
    name: CelebV-Ref_train
    gt_dir: ~
    lr_dir: ~
    video: true
    tempo_extent: 10
    data_type: rgb
    batch_size: 4
    num_workers: 0
    pin_memory: true
    conditional: true  # use reference image as conditioning for model training
    load_reference: true  # load reference image for ID loss
    num_references: 5
    ref_augment: false
    ref_conds_path: ~

    # GT latents
    latent_gt_path: external_utils/CodeFormer/latent_gt_code1024.pth

    # One-step degradation  # Hard
    final_sinc_prob: 0.0 # 0.3
    sharpen_gt_prob: 0
    first_degradation:
      blur_prob: 1  # 1
      blur_kernel_size: 21
      resize_prob: [0.0, 1.0, 0.0]  # up, down, keep
      resize_range: [0.1, 1]  # Downscale between x1 and x10
      kernel_list: ['iso', 'aniso']
      kernel_prob: [0.5, 0.5]
      sinc_prob: 0.0  # 0.1
      blur_sigma: [0, 16]
      betag_range: [0.5, 4]
      betap_range: [1, 2]
      gaussian_noise_prob: 0.4  # 0.4
      poisson_noise_prob: 0.4  # 0.4
      noise_range: [0, 20]
      poisson_scale_range: [0.05, 3]
      gray_noise_prob: 0.4 # 0.4
      
      # CRF 
      crf_prob: 1.0
      crf_range: [25, 45]
      crf_codecs: ['libx264', 'h264']   # optional
      crf_codec_probs: [0.5, 0.5]


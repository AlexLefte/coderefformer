# model configs
model:
  name: CodeRefFormer  # Model name: ISR (Image Super-Resolution) / VSR (Video Super-Resolution), etc.

  generator:
    dim_embd: 512
    n_head: 8
    n_layers: 9
    codebook_size: 1024
    connect_list: ['32', '64', '128', '256']
    fix_modules: ['quantize','generator']
    strict_load: false
    conditional: true
    return_ref_kv: false
    w_scale: 0.8

  discriminator:
    nc: 3
    ndf: 64
    n_layers: 4

  network_vqgan: # this config is needed if no pre-calculated latent
    img_size: 512
    nf: 64
    ch_mult: [1, 2, 2, 4, 4, 8]
    quantizer: 'nearest'
    codebook_size: 1024
    load_path: external_utils/CodeFormer/vqgan_code1024.pth

  # Checkpoints paths
  # g_name: Idp_CodeFormer_V1 
  g_name: CodeFormer
  
  # g_load_path: experiments/coderefformer_v1_one_step_degrade_b1_ref1_wgan_r1_0_01/train/ckpt/G_iter110000.pth
  # g_load_path: D:\idpfvsr\checkpoints\coderefformer_v1_wgan_r1_0_01_hard_id_loss\G_iter460000.pth
  # g_load_path: D:\idpfvsr\checkpoints\coderefformer_v3_3_refs_sft_se\G_iter80000.pth
  g_load_path: external_utils\CodeFormer\codeformer.pth
  # g_load_path: experiments\codeformer_finetune_facial_comp_critic_two_step_degrad_hgan_facial_r1_reg_fixed_accumulate_4_iter_v3\train\ckpt\G_iter80000.pth
  # g_load_path: D:\idpfvsr\checkpoints\idp_codeformer_facial_comp_critic_two_step_degrad\G_iter80000.pth
  d_name: VQGANDiscriminator
  d_load_path: ~

# training configs
train:
  # CodeFormer related
  use_hq_feat_loss: true
  feat_loss_weight: 1.0
  cross_entropy_loss: true
  entropy_loss_weight: 0.5
  use_adaptive_weight: false
  scale_adaptive_gan_weight: 0.1  # someone said 0.6 is better

  tempo_extent: 1
  start_iter: 0
  total_iter: 500000
  ema_decay: 0.997

  # configs for generator
  generator:
    lr: !!float 1e-5
    lr_schedule:
      # type: FixedLR
      type: MultiStepLR
      milestones: [250000, 500000]
      gamma: 0.5
    beta1: 0.9
    beta2: 0.999
    warm_up_iters: 500
    warm_up_layers: ['id_enc']

  discriminator:
    update_policy: adaptive
    update_threshold: 0.4
    crop_border_ratio: 0.75
    lr: !!float 1e-5
    lr_schedule:
      # type: FixedLR
      type: MultiStepLR
      milestones: [250000, 500000]
      gamma: 0.5
    beta1: 0.9
    beta2: 0.99
    n_critic: 1

  # criterions
  # pixel-wise criterion
  pixel_crit:
    type: CB
    weight: 1
    reduction: mean

  # perceptual criterion  # TODO: replace with LPIPS from CodeFormer
  # feature_crit:
  #   type: WeightedLPIPS
  #   base_loss_type: L1
  #   weight: 0.01
  #   reduction: mean
  #   feature_layers: [2, 7, 16, 25, 34]  # "conv1_2", "conv2_2", "conv3_4", "conv4_4", "conv5_4" - before ReLU
  #   feature_weights: [0.1, 0.1, 1, 1, 1]

  feature_crit:
    type: LPIPS
    weight: 1
    use_input_norm: true
    use_range_norm: true

  # identity criterion
  id_crit:
    type: CosineSimilarity
    weight: 1.0
    reduction: mean
    hard_loss: false  # Whether to add the cosine term between the prediction's ID embedding and the reference id embedding
    id_network_path: external_utils/webface_r50.onnx
    id_embeddings_file: D:\idpfvsr\datasets\FFHQ\no_ref/downscaled_x2/FFHQ_id_embeddings_512_arcface50.pt

  # # roi criterion (used for eyes and mouth)
  # facial_comp_crit:
  #   type: L1
  #   weight: 1.0
  #   hard_loss: false # Whether to add the LPIPS term between 
  #   reduction: mean
  #   enlarge_eye: [1.5, 1.5]
  #   enlarge_mouth: [1.2, 1.2]
  #   eye_size: 80
  #   mouth_size: 120
  #   face_ratio: 1.0
  #   feature_layers: [2, 7, 16, 25, 34]
  #   feature_weights: [0.1, 0.1, 1, 1, 1]

  # gan loss
  gan_crit:
    type: WGAN_SoftPlus
    weight: !!float 1e-1
    # r1 regularization for discriminator
    r1_reg_weight: 0.01
    net_d_iters: 1
    net_d_init_iters: 0
    net_d_reg_every: 16
    net_d_start_iters: 0

  # gan_crit:
  #   type: HingeGAN
  #   weight: !!float 1e-1
  #   r1_reg_weight: 0  # r1 regularization for discriminator
  #   net_d_reg_every: 0
  #   net_d_iters: 1
  #   net_d_init_iters: 0

# validation configs
test:
  tempo_extent: 0
  test_freq: 10000

  # whether to save the generated SR results
  save_res: true
  res_dir: ~   # use default dir

  # whether to save the test results in a json file
  save_json: true
  json_dir: ~  # use default dir

  padding_mode: reflect
  num_pad_front: 0



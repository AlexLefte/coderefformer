    # GT latents
    latent_gt_path: external_utils/CodeFormer/latent_gt_code1024.pth

    degradation:
      type: Synth
      sigma: 1.5

    # One-step degradation  # Hard
    final_sinc_prob: 0.0 # 0.3
    sharpen_gt_prob: 0
    first_degradation:
      blur_prob: 1  # 1
      blur_kernel_size: 41
      resize_prob: [0.0, 0.9, 0.1]  # up, down, keep
      resize_range: [0.03125, 1]
      kernel_list: ['iso', 'aniso']
      kernel_prob: [0.5, 0.5]
      sinc_prob: 0.0  # 0.1
      blur_sigma: [0, 16]
      betag_range: [0.5, 4]
      betap_range: [1, 2]
      gaussian_noise_prob: 0.4  # 0.4
      poisson_noise_prob: 0.4  # 0.4
      noise_range: [0, 20]
      poisson_scale_range: [0.05, 3]
      gray_noise_prob: 0.4 # 0.4
      jpeg_prob: 1.0 # 0.8
      jpeg_range: [30, 100]
    

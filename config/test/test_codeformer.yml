    lr_dir: ~
    filter_file: ~
    data_type: rgb
    batch_size: 1
    num_workers: 0
    pin_memory: true
    conditional: true  # use reference image as conditioning for model training
    load_reference: true  # load reference image for ID loss
    num_references: 1
    ref_conds_path: ~
    id_embeddings_path: D:\idpfvsr\datasets\FFHQ\no_ref/downscaled_x2/FFHQ_id_embeddings_512_arcface50.pt

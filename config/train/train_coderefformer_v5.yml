# model configs
model:
  name: CodeRefFormer  # Model name: ISR (Image Super-Resolution) / VSR (Video Super-Resolution), etc.

  generator:
    dim_embd: 512
    n_head: 8
    n_layers: 9
    codebook_size: 1024
    connect_list: ['32', '64', '128', '256']    
    strict_load: false
    conditional: true
    return_ref_kv: false
    w_scale: 1 

    # SFT fusion type: 'se' or 'attention'
    ref_sft: true
    adain_ref: false
    adain_per_head: false
    sft_fusion_type: ''  # 'se' or 'attention'
    
    # Identity context configuration
    arcface_dim: 512           # ArcFace embedding dimension

    # FaRL — set use_farl: true to enable composite context (1 + 197 = 198 tokens)
    # set use_farl: false for ArcFace-only (1 token)
    use_farl: true
    farl_dim: 768              # FaRL ViT-B token dimension — ignored if use_farl: false
    farl_tokens: 197           # FaRL sequence length — ignored if use_farl: false

    # Cross-attention heads in IDCrossAttentionSFT
    id_nhead: 4

    # FaRL embedding encoder
    farl_path: external_utils/FaRL/FaRL-Base-Patch16-LAIONFace20M-ep64.pth

  discriminator:
    nc: 3
    ndf: 64
    n_layers: 4

  # Pre-trained HQ VQ-VAE
  network_vqgan: # this config is needed if no pre-calculated latent
    img_size: 512
    nf: 64
    ch_mult: [1, 2, 2, 4, 4, 8]
    quantizer: 'nearest'
    codebook_size: 1024
    load_path: external_utils/CodeFormer/vqgan_code1024.pth

  # Checkpoints paths
  g_name: CodeRefFormer_V5
  d_name: VQGANDiscriminator
  
  # Simple CodeFormer
  g_load_path: external_utils/CodeFormer/codeformer.pth
  d_load_path: external_utils/CodeFormer/vqgan_discriminator.pth

# training configs
train:
  # CodeFormer Codebook related losses
  use_hq_feat_loss: true
  feat_loss_weight: 1.0
  cross_entropy_loss: true
  entropy_loss_weight: 0.5
  use_adaptive_weight: true
  scale_adaptive_gan_weight: 1

  # Iterations config
  accum_steps: 4
  tempo_extent: 1
  start_iter: 0
  total_iter: 125000  # Using 4 accumulation steps
  ema_decay: 0.997

  # For V5
  warmup:
    modules:
      # Permanent freeze
      quantize:
        mode: fix
      generator:
        mode: fix

      # Warmup new modules first — ft_layers already pretrained from checkpoint
      # so we warm up only the new identity injection blocks
      fuse_convs_dict:         # IDCrossAttentionSFT blocks
        mode: warmup
        iters: 5000
      ctx_builders:            # CompositeContextBuilder per resolution
        mode: warmup
        iters: 5000
      id_pool:                 # ArcFace attention pooling
        mode: warmup
        iters: 5000

      # After warmup, ft_layers joins training
      # ft_layers:
      #   mode: freeze
      #   iters: 5000

  # configs for generator
  generator:
    lr: !!float 1e-5
    lr_schedule:
      # type: FixedLR
      type: MultiStepLR
      milestones: [250000, 500000]
      gamma: 0.5
    beta1: 0.9
    beta2: 0.999
    warm_up_iters: 0
    warm_up_layers: []

  discriminator:
    update_policy: adaptive
    update_threshold: 0.4
    crop_border_ratio: 0.75
    lr: !!float 1e-5
    lr_schedule:
      # type: FixedLR
      type: MultiStepLR
      milestones: [250000, 500000]
      gamma: 0.5
    beta1: 0.9
    beta2: 0.99
    n_critic: 1

  # criterions
  # pixel-wise criterion
  pixel_crit:
    type: CB
    weight: 1
    reduction: mean

  # perceptual criterion  # TODO: replace with LPIPS from CodeFormer
  # feature_crit:
  #   type: WeightedLPIPS
  #   base_loss_type: L1
  #   weight: 0.01
  #   reduction: mean
  #   feature_layers: [2, 7, 16, 25, 34]  # "conv1_2", "conv2_2", "conv3_4", "conv4_4", "conv5_4" - before ReLU
  #   feature_weights: [0.1, 0.1, 1, 1, 1]

  feature_crit:
    type: LPIPS
    weight: 1
    use_input_norm: true
    use_range_norm: true

  # identity criterion
  id_crit:
    type: CosineSimilarity
    weight: 1.0
    reduction: mean
    hard_loss: true  # Whether to add the cosine term between the prediction's ID embedding and the reference id embedding
    id_network_path: external_utils/webface_r50.onnx
    id_embeddings_file: /home/alex/Datasets/FFHQ/downscaled_x2/FFHQ_id_embeddings_512_arcface50.pt

  # # roi criterion (used for eyes and mouth)
  # facial_comp_crit:
  #   type: L1
  #   weight: 1.0
  #   hard_loss: false # Whether to add the LPIPS term between 
  #   reduction: mean
  #   enlarge_eye: [1.5, 1.5]
  #   enlarge_mouth: [1.2, 1.2]
  #   eye_size: 80
  #   mouth_size: 120
  #   face_ratio: 1.0
  #   feature_layers: [2, 7, 16, 25, 34]
  #   feature_weights: [0.1, 0.1, 1, 1, 1]

  # gan loss
  # gan_crit:
  #   type: WGAN_SoftPlus
  #   weight: !!float 1e-1
  #   # r1 regularization for discriminator
  #   r1_reg_weight: 10
  #   net_d_iters: 1
  #   net_d_init_iters: 0
  #   net_d_start_iters: 5001  # Warming up iterations
  #   net_d_reg_every: 16

  gan_crit:
    type: WGAN_SoftPlus
    weight: !!float 1e-1
    # r1 regularization for discriminator
    r1_reg_weight: 0
    net_d_iters: 1
    net_d_init_iters: 0
    net_d_reg_every: 16
    net_d_start_iters: 0

# validation configs
test:
  tempo_extent: 0
  test_freq: 5000

  # whether to save the generated SR results
  save_res: false
  res_dir: ~   # use default dir

  # whether to save the test results in a json file
  save_json: true
  json_dir: ~  # use default dir

  padding_mode: reflect
  num_pad_front: 0


